<!doctype html>
<html lang="ja">
  <head>

    <title>メンバー別ニュース | えびそく！</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8002455848254296" crossorigin="anonymous"></script>
  </head>
  <body data-base=".." data-page="members" data-title="メンバー別ニュース" data-intro="メンバー名を選ぶと、その人に関するニュースだけを表示します。">
    <header class="site-header">
      <div class="tri tri-header-one" aria-hidden="true"></div>
      <div class="tri tri-header-two" aria-hidden="true"></div>
      <div class="header-inner">
        <div class="brand-block"><a class="brand" href="../">えびそく！</a><p class="tagline">メンバー別ニュース</p></div>
        <nav class="category-nav" aria-label="サイトメニュー"></nav>
      </div>
    </header>
    <main>
      <section class="ad-slot ad-slot-wide" aria-label="広告"><span>広告</span></section>
      <section class="controls" aria-label="記事フィルター">
        <div class="section-heading"><span class="heading-mark" aria-hidden="true"></span><h1 id="pageTitle">メンバー別ニュース</h1></div>
        <p class="page-intro" id="pageIntro">メンバー名を選ぶと、その人に関するニュースだけを表示します。プロフィールは各グループの公式サイトで確認してください。</p>
        <div id="autoOverview"></div>
        <div class="member-directory" id="memberDirectory" ></div>
        <div class="control-row"><label class="search-box"><span>検索</span><input id="searchInput" type="search" placeholder="グループ名・メンバー名・ニュース名で検索"></label></div>
        <div class="filter-group" id="groupFilters" aria-label="グループ"></div>
        <div class="filter-group" id="statusFilters" aria-label="現役または元メンバー"></div>
      </section>
      <section class="summary-bar" aria-live="polite"><p id="summaryText">記事を読み込み中です。</p><p id="updatedText"></p></section>
      <section class="article-list" id="articleList" aria-label="記事一覧"></section>
      <section class="ad-slot ad-slot-wide" aria-label="広告"><span>広告</span></section>
    </main>
    <footer class="site-footer">
      <nav class="footer-links" aria-label="サイト情報"><a href="../ebidan/">EBiDANガイド</a><a href="../guide/">ニュースの見方</a><a href="../policy/">RSS・掲載方針</a><a href="../about/">運営者情報</a><a href="../contact/">お問い合わせ</a><a href="../privacy/">プライバシーポリシー</a></nav>
      <p>記事本文は転載せず、元記事へのリンクを掲載します。</p>
    </footer>
    <template id="articleTemplate">
      <article class="article-card">
        <div class="article-meta"><span class="source"></span><time></time></div>
        <h2><a class="title" target="_blank" rel="noopener noreferrer"></a></h2>
        <p class="summary"></p>
        <div class="badges"></div>
        <a class="read-link" target="_blank" rel="noopener noreferrer">元記事を読む</a>
      </article>
    </template>
    <script src="../app.js?v=20260712" type="module"></script>
